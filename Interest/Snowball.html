<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debt Snowball Calculator – Pro</title>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --primary:#2563eb;
  --success:#16a34a;
  --danger:#ef4444;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e5e7eb;
  --radius:16px;
  --shadow:0 14px 36px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:var(--text);
}
h1{text-align:center;color:var(--primary);margin:22px 0}
.container{max-width:1200px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:420px 1fr;gap:28px}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:24px;
}
.section{margin-bottom:22px}
.section h3{margin-bottom:12px;color:var(--primary)}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
input{
  width:100%;
  padding:11px;
  border-radius:12px;
  border:1px solid var(--border);
  font-size:14px;
  margin-bottom:10px
}
button{
  padding:14px;
  border:none;
  border-radius:14px;
  font-weight:600;
  cursor:pointer
}
.primary{background:var(--primary);color:#fff}
.secondary{background:#eef2ff}
.dark{background:#111827;color:#fff}

.results{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:18px
}
.result{
  background:#f8fafc;
  border-radius:14px;
  padding:14px;
  text-align:center
}
.result b{display:block;font-size:18px}
.result small{font-size:12px;color:var(--muted)}

.progress-bar{
  height:14px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
  margin-bottom:16px
}
.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--primary),var(--success));
  transition:.6s
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px
}
th,td{
  padding:10px;
  border-bottom:1px solid var(--border);
  text-align:right
}
th:first-child,td:first-child{text-align:left}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .results{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>
<h1>❄️ Debt Snowball Calculator – Pro</h1>

<div class="container">
<div class="grid">

<!-- LEFT -->
<div class="card">

  <div class="section">
    <h3>Debt Accounts</h3>

    <label>Debt 1 – Balance</label>
    <input id="b1" value="5000">
    <label>Debt 1 – APR (%)</label>
    <input id="r1" value="18">
    <label>Debt 1 – Minimum Payment</label>
    <input id="m1" value="150">

    <label>Debt 2 – Balance</label>
    <input id="b2" value="8000">
    <label>Debt 2 – APR (%)</label>
    <input id="r2" value="12">
    <label>Debt 2 – Minimum Payment</label>
    <input id="m2" value="200">

    <label>Debt 3 – Balance</label>
    <input id="b3" value="15000">
    <label>Debt 3 – APR (%)</label>
    <input id="r3" value="6">
    <label>Debt 3 – Minimum Payment</label>
    <input id="m3" value="300">
  </div>

  <div class="section">
    <h3>Extra Monthly Payment</h3>
    <input id="extra" value="200">
  </div>

  <button class="primary" onclick="calculate()">Calculate Snowball</button>
  <button class="secondary" onclick="location.reload()">Reset</button>
</div>

<!-- RIGHT -->
<div class="card">

  <div class="results">
    <div class="result"><b id="months">–</b><small>Months to Debt-Free</small></div>
    <div class="result"><b id="interest">–</b><small>Total Interest</small></div>
    <div class="result"><b id="total">–</b><small>Total Paid</small></div>
    <div class="result"><b id="date">–</b><small>Debt-Free Date</small></div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress"></div>
  </div>

  <h3>Snowball Payoff Summary</h3>
  <table>
    <thead>
      <tr>
        <th>Month</th>
        <th>Remaining Balance</th>
      </tr>
    </thead>
    <tbody id="table"></tbody>
  </table>

  <br>
  <button class="dark" onclick="window.print()">🖨 Print / Export PDF</button>
</div>

</div>
</div>

<script>
const $ = id => document.getElementById(id);

function money(n){
  return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n);
}

function calculate(){
  let debts=[
    {bal:+$("b1").value, rate:+$("r1").value/100/12, min:+$("m1").value},
    {bal:+$("b2").value, rate:+$("r2").value/100/12, min:+$("m2").value},
    {bal:+$("b3").value, rate:+$("r3").value/100/12, min:+$("m3").value}
  ].filter(d=>d.bal>0);

  debts.sort((a,b)=>a.bal-b.bal);

  let extra=+$("extra").value;
  let month=0,totalInterest=0,totalPaid=0;
  let startTotal=debts.reduce((s,d)=>s+d.bal,0);
  let rows="";

  while(debts.length && month<600){
    month++;
    let availableExtra=extra;

    debts.forEach(d=>{
      let interest=d.bal*d.rate;
      totalInterest+=interest;
      d.bal+=interest;
    });

    debts.forEach((d,i)=>{
      let pay=d.min+(i===0?availableExtra:0);
      pay=Math.min(pay,d.bal);
      d.bal-=pay;
      totalPaid+=pay;
      if(i===0) availableExtra=0;
    });

    debts=debts.filter(d=>d.bal>0);
    let remaining=debts.reduce((s,d)=>s+d.bal,0);

    rows+=`<tr><td>${month}</td><td>${money(remaining)}</td></tr>`;
    $("progress").style.width=((1-remaining/startTotal)*100).toFixed(1)+"%";
  }

  $("months").textContent=month;
  $("interest").textContent=money(totalInterest);
  $("total").textContent=money(totalPaid);
  $("table").innerHTML=rows;

  let d=new Date();
  d.setMonth(d.getMonth()+month);
  $("date").textContent=d.toLocaleDateString();
}

calculate();
</script>
</body>
</html>

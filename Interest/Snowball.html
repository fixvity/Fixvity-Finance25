<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debt Snowball Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --primary:#2563eb;
  --success:#16a34a;
  --danger:#ef4444;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e5e7eb;
  --radius:16px;
  --shadow:0 14px 36px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:var(--text);
}
h1{text-align:center;color:var(--primary);margin:22px 0}
.container{max-width:1200px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:380px 1fr;gap:28px}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:24px;
}
.section{margin-bottom:22px}
.section h3{margin-bottom:12px;color:var(--primary)}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
input{
  width:100%;
  padding:11px;
  border-radius:12px;
  border:1px solid var(--border);
  font-size:14px;
  margin-bottom:10px
}
button{
  padding:14px;
  border:none;
  border-radius:14px;
  font-weight:600;
  cursor:pointer
}
.primary{background:var(--primary);color:#fff}
.secondary{background:#eef2ff}

.results{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:18px
}
.result{
  background:#f8fafc;
  border-radius:14px;
  padding:14px;
  text-align:center
}
.result b{display:block;font-size:18px}
.result small{font-size:12px;color:var(--muted)}

.progress-bar{
  height:14px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
  margin-bottom:18px
}
.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--primary),var(--success));
}

.chart-box{
  height:260px;
  margin-bottom:20px;
}

.table-wrap{
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}
.table-body{
  max-height:360px;
  overflow:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px
}
thead{background:#f1f5f9;position:sticky;top:0}
th,td{
  padding:10px;
  border-bottom:1px solid var(--border);
  text-align:right
}
th:first-child,td:first-child{text-align:center}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .results{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>
<h1>❄️ Debt Snowball Calculator </h1>

<div class="container">
<div class="grid">

<!-- LEFT -->
<div class="card">
  <div class="section">
    <h3>Debt Accounts</h3>

    <label>Debt 1 – Balance</label>
    <input id="b1" value="5000">
    <label>Debt 1 – APR (%)</label>
    <input id="r1" value="18">
    <label>Debt 1 – Min Payment</label>
    <input id="m1" value="150">

    <label>Debt 2 – Balance</label>
    <input id="b2" value="8000">
    <label>Debt 2 – APR (%)</label>
    <input id="r2" value="12">
    <label>Debt 2 – Min Payment</label>
    <input id="m2" value="200">

    <label>Debt 3 – Balance</label>
    <input id="b3" value="15000">
    <label>Debt 3 – APR (%)</label>
    <input id="r3" value="6">
    <label>Debt 3 – Min Payment</label>
    <input id="m3" value="300">
  </div>

  <div class="section">
    <h3>Extra Monthly Payment</h3>
    <input id="extra" value="200">
  </div>

  <button class="primary" onclick="calculate()">Calculate Snowball</button>
  <button class="secondary" onclick="location.reload()">Reset</button>
</div>

<!-- RIGHT -->
<div class="card">

  <div class="results">
    <div class="result"><b id="months">–</b><small>Months to Debt-Free</small></div>
    <div class="result"><b id="interest">–</b><small>Total Interest</small></div>
    <div class="result"><b id="paid">–</b><small>Total Paid</small></div>
    <div class="result"><b id="date">–</b><small>Debt-Free Date</small></div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress"></div>
  </div>

  <h3>Debt Balance Over Time</h3>
  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>

  <h3>Snowball Payoff Summary</h3>
  <div class="table-wrap">
    <div class="table-body">
      <table>
        <thead>
          <tr>
            <th>Month</th>
            <th>Remaining Balance</th>
          </tr>
        </thead>
        <tbody id="table"></tbody>
      </table>
    </div>
  </div>

</div>
</div>
</div>

<script>
let balanceChart;

function money(n){
  return "$" + n.toLocaleString(undefined,{minimumFractionDigits:2});
}

function calculate(){
  let debts=[
    {bal:+b1.value, rate:+r1.value/100/12, min:+m1.value},
    {bal:+b2.value, rate:+r2.value/100/12, min:+m2.value},
    {bal:+b3.value, rate:+r3.value/100/12, min:+m3.value}
  ];

  let extraPay=+extra.value;
  let month=0,totalInterest=0,totalPaid=0;
  let rows="",labels=[],data=[];
  let startTotal=debts.reduce((a,d)=>a+d.bal,0);

  while(debts.some(d=>d.bal>0) && month<600){
    month++;

    debts.sort((a,b)=>a.bal-b.bal);

    let snowball=extraPay;
    let totalBal=0;

    debts.forEach(d=>{
      if(d.bal<=0) return;

      let interest=d.bal*d.rate;
      d.bal+=interest;
      totalInterest+=interest;

      let payment=d.min+snowball;
      payment=Math.min(payment,d.bal);

      d.bal-=payment;
      totalPaid+=payment;
      snowball+=d.min;

      totalBal+=d.bal;
    });

    labels.push("M"+month);
    data.push(totalBal);
    rows+=`<tr><td>${month}</td><td>${money(totalBal)}</td></tr>`;
  }

  months.textContent=month;
  interest.textContent=money(totalInterest);
  paid.textContent=money(totalPaid);
  table.innerHTML=rows;

  progress.style.width=((1-data[data.length-1]/startTotal)*100).toFixed(1)+"%";

  let d=new Date();
  d.setMonth(d.getMonth()+month);
  date.textContent=d.toLocaleDateString();

  balanceChart?.destroy();
  balanceChart=new Chart(chart,{
    type:"line",
    data:{
      labels,
      datasets:[{
        data,
        borderColor:"#2563eb",
        backgroundColor:"rgba(37,99,235,.12)",
        fill:true,
        tension:.35,
        pointRadius:2
      }]
    },
    options:{
      maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        y:{beginAtZero:true,ticks:{callback:v=>"$"+v.toLocaleString()}}
      }
    }
  });
}

calculate();
</script>
</body>
</html>
